<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071018" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Andrew's Apps" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
<title>Andrew's Apps — Web Launcher</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #071018; color: #eaf2f0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 48px 20px 32px;
  }
  h1 { font-size: 28px; margin-bottom: 6px; }
  .sub { color: #8fa3a0; font-size: 14px; margin-bottom: 36px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 18px; width: 100%; max-width: 520px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: #0e1a20; border: 1px solid #1e3038; border-radius: 20px;
    padding: 26px 14px 20px; text-decoration: none; color: inherit;
    transition: transform .12s ease, border-color .12s ease;
  }
  .tile:active { transform: scale(.96); border-color: #4de0c8; }
  .tile img { width: 72px; height: 72px; border-radius: 18px; }
  .tile .name { font-size: 17px; font-weight: 700; }
  .tile .desc { font-size: 12px; color: #8fa3a0; text-align: center; line-height: 1.4; }
  .foot { margin-top: 44px; font-size: 12px; color: #5c6f6c; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <h1>🚀 Andrew's Apps</h1>
  <div class="sub">your web launcher — tap a tile to open the app</div>
  <div class="grid">
    <a class="tile" href="https://sheildbiter.github.io/Zeno/">
      <img src="assets/zeno-icon-192.png" alt="Zeno" />
      <div class="name">Zeno</div>
      <div class="desc">Your on-device AI brain · v0.11.1</div>
    </a>
    <a class="tile" href="voice/">
      <img src="voice/assets/kavi-touch-icon.jpg" alt="Talk to Kavi" />
      <div class="name">Talk to Kavi</div>
      <div class="desc">Push-to-talk voice remote for Kavi</div>
    </a>
  </div>
  <div class="foot">Tip: add this page to your Home Screen<br/>for one-tap access to everything.</div>
</body>
</html>
